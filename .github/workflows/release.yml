name: Release

# Tag-driven release pipeline. Push a v* tag → this workflow archives,
# notarizes, attaches a notarized DMG to the GitHub Release, regenerates
# the Sparkle appcast, and publishes it to gh-pages.
#
# Bootstrap is owed-to-Estevan before the first v* tag will produce a green
# release — see tools/release/README.md for the four steps (Sparkle keypair,
# Apple Developer ID cert, notarization creds, GitHub Pages enablement).

on:
  push:
    tags: ['v*']

permissions:
  # contents:write needed for softprops/action-gh-release to attach the DMG
  # to the Release, and for peaceiris/actions-gh-pages to push the appcast
  # to the gh-pages branch.
  contents: write

jobs:
  release:
    name: Notarize + appcast + publish
    runs-on: macos-15
    env:
      # Tag name from the trigger ref, surfaced as an env var so downstream
      # shell snippets read it via "$TAG_NAME" rather than ${{ ... }}
      # interpolation. Tags match v* (constrained by the trigger), but the
      # env-var pattern is the safe-by-default Actions idiom.
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so generate-appcast.sh can compute
          # `git rev-list --count <tag>` for the appcast's sparkle:version.
          fetch-depth: 0
          fetch-tags: true

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        # create-dmg dropped at v0.2.4 — DMG is now built via hdiutil
        # (system-shipped) for a barebones single-icon install window.
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App/RORORO.xcodeproj \
            -scheme RORORO

      - name: Locate Sparkle sign_update utility
        run: |
          # SPM caches Sparkle's bin/ under ~/Library/Developer/Xcode/DerivedData
          # after -resolvePackageDependencies. Pin its path for the appcast step.
          SIGN_UPDATE_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -name sign_update -type f -not -path "*/old_dsa_scripts/*" 2>/dev/null | head -n 1 || true)"
          if [[ -z "$SIGN_UPDATE_PATH" ]]; then
            echo "::error::sign_update not found in DerivedData. SPM resolution may have failed."
            exit 1
          fi
          echo "SPARKLE_SIGN_UPDATE_PATH=$SIGN_UPDATE_PATH" >> "$GITHUB_ENV"
          echo "Resolved sign_update at $SIGN_UPDATE_PATH"

      - name: Import Apple Developer ID Application certificate
        # Hand-rolled `security create-keychain` + `security import` worked for
        # the archive step but xcodebuild's exportArchive resolves the signing
        # identity through a different code path that's keychain-search-list-
        # sensitive across step boundaries (caught at v0.1.0 first run).
        # apple-actions/import-codesign-certs is the well-trodden fix — it
        # creates a build keychain, imports, persists the search list across
        # subsequent steps, and unlocks for $RUNNER_TEMP lifetime.
        id: import-app-cert
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Import Apple Developer ID Installer certificate
        # Second cert, distinct from Developer ID Application: signs the
        # .pkg envelope (productbuild) so macOS Installer.app trusts the
        # package + notarization picks up both the pkg sig and the inner
        # .app sig. We import into the SAME `signing_temp` keychain the
        # first step created (so xcodebuild's signing search list, which
        # was set up by step 1, also resolves the Installer identity).
        # `keychain-password` here is the keychain UNLOCK password — the
        # first step auto-generated it and exposed it as an output, which
        # we pipe through. Distinct from `p12-password` (which unwraps
        # the .p12 envelope itself).
        uses: apple-actions/import-codesign-certs@v3
        with:
          create-keychain: false
          keychain-password: ${{ steps.import-app-cert.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}

      - name: Compute build number
        # Monotonic per-commit build number used for both
        # CFBundleVersion (the bundle) and sparkle:version (the appcast).
        # Surfaces existing v0.2.x users from the "You're up to date"
        # trap caused by their bundles shipping with CFBundleVersion="2"
        # while the appcast quoted dotted-numeric versions like "0.2.2".
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Computed BUILD_NUMBER=$BUILD_NUMBER"

      - name: Notarize and PKG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_INSTALLER_CERTIFICATE_NAME: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_NAME }}
          # TAG_NAME + BUILD_NUMBER are inherited from the job-level env
          # and the Compute build number step. notarize.sh asserts both.
        run: bash tools/release/notarize.sh

      - name: Attach PKG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/RORORO.pkg
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Generate appcast.xml
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/release/generate-appcast.sh

      - name: Publish appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        env:
          # Surface the tag for the commit message body via env var rather
          # than ${{ ... }} interpolation in a shell-evaluated context.
          PUBLISH_TAG: ${{ github.ref_name }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: "release(appcast): publish appcast for ${{ github.ref_name }}"

      - name: Bump Homebrew tap
        # Auto-bump the cask in estevanhernandez-stack-ed/homebrew-rororo so
        # `brew upgrade --cask rororo` picks up the new version without
        # manual intervention. Skipped if HOMEBREW_TAP_PAT secret isn't set
        # so the workflow still succeeds on machines without the tap PAT
        # configured.
        if: ${{ env.HAS_TAP_PAT == 'true' }}
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
          TAG_NAME: ${{ github.ref_name }}
          HAS_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT != '' }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          SHA256="$(shasum -a 256 "build/RORORO.pkg" | awk '{print $1}')"
          echo "Bumping cask to version=$VERSION sha256=$SHA256"

          TAP_DIR="$RUNNER_TEMP/homebrew-rororo"
          git clone "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/estevanhernandez-stack-ed/homebrew-rororo.git" "$TAP_DIR"

          pushd "$TAP_DIR" >/dev/null
          git config user.name "rororo-mac release bot"
          git config user.email "actions@github.com"

          # Idempotent rewrite: sed in-place rewrites version + sha256
          # without touching anything else. -E uses extended regex; the
          # leading whitespace + literal quotes anchor the match precisely.
          sed -i.bak -E "s|^  version \".*\"|  version \"$VERSION\"|" Casks/rororo.rb
          sed -i.bak -E "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" Casks/rororo.rb

          # v0.2.5+: cask ships .pkg, not .dmg. One-time migration —
          # naturally idempotent (the awk match condition only fires
          # when the `app` stanza is still present; once migrated, the
          # file passes through unchanged on every subsequent release).
          # The `app` artifact stanza becomes `pkg` + a pkgutil uninstall
          # declaration (so `brew uninstall --cask rororo` removes the
          # installed bundle that the .pkg dropped into /Applications).
          sed -i.bak -E "s|/RORORO\.dmg|/RORORO.pkg|g" Casks/rororo.rb
          awk '
            /^  app "RORORO\.app"$/ {
              print "  pkg \"RORORO.pkg\""
              print ""
              print "  uninstall pkgutil: \"com.626labs.rororo-mac\""
              migrated = 1
              next
            }
            { print }
            END { if (migrated) print "Migrated cask from app to pkg stanza." > "/dev/stderr" }
          ' Casks/rororo.rb > Casks/rororo.rb.new
          mv Casks/rororo.rb.new Casks/rororo.rb
          rm -f Casks/rororo.rb.bak

          if git diff --quiet; then
            echo "Cask already at v$VERSION; no commit needed."
            popd >/dev/null
            exit 0
          fi

          git add Casks/rororo.rb
          git commit -m "release(rororo): bump to v$VERSION (auto-bumped by release workflow)"
          git push
          popd >/dev/null
