name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Single concurrent run per branch — cancel older in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-build:
    name: Xcode build + test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project App/RORORO.xcodeproj \
            -scheme RORORO \
            -configuration Debug \
            -destination 'platform=macOS' \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (Debug)
        run: |
          xcodebuild \
            -project App/RORORO.xcodeproj \
            -scheme RORORO \
            -configuration Debug \
            -destination 'platform=macOS,arch=x86_64' \
            test \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
